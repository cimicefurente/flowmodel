# The companion as a node of this repo's method (ADR-0005), N1-N13.
# Its instructions are in prompts/companion.md; the cold-start test is in method/cold-start-test.md.
kind: node
id: companion
name: Companion
type: ai_agent
origin: internal
purpose: Coordinates the executors of the open tickets and brings the maintainer every question and report in a form ready for a decision.
input:
  - from: maintainer
    artifact: agents-rules
    trigger: Session start.
    preconditions: AGENTS.md as it is on main.
  - from: tracker
    artifact: tracker-state
    trigger: Session start, then after every event on a ticket or a pull request.
    preconditions: Every decision and every open question is already written in the tracker.
  - from: companion
    artifact: companion-handoff
    trigger: Session start, when an earlier session handed off.
    preconditions: The latest handoff; when there is none, the session starts from the other inputs and the list of local worktrees.
  - from: maintainer
    artifact: decision
    trigger: Event, an answer to a question or a merge.
  - from: executor
    artifact: executor-report
    trigger: Event, an executor ends its run.
output:
  - to: tracker
    artifact: ticket
    postconditions: Every decision and every question is written in the tracker at once, cited by issue or pull request number.
  - to: executor
    artifact: executor-prompt
    postconditions: One executor per ticket, in its own worktree; at most three run at once.
  - to: reviewer
    artifact: reviewer-prompt
    postconditions: Only for complex tickets; the reviewer is independent of the executor.
  - to: maintainer
    artifact: question
    postconditions: One question at a time, with a recommendation.
  - to: maintainer
    artifact: report
    postconditions: Brief, with the evidence cited by issue or pull request number.
  - to: companion
    artifact: companion-handoff
    postconditions: Holds only what the tracker cannot hold.
owner: The maintainer (protected area, MB-6)
card_status:
  status: hypothesis
determinism: false
verification:
  method: The maintainer decides every question and reviews and merges every pull request; the cold-start test checks the handoff to a fresh session.
  verifiers:
    - maintainer
    - cold-start-test
errors_and_limits:
  error_outputs:
    - to: maintainer
      artifact: report
      postconditions: A context warning, sent once at each threshold.
    - to: companion
      artifact: companion-handoff
      postconditions: Written at the test threshold and again at the change threshold.
  budget:
    cost:
      amount: 200000
      unit: context tokens
  escalation: >-
    Two context thresholds. Test, near 150000 context tokens: warn the maintainer,
    write the handoff and run the cold-start test on it. Change, near 200000 context
    tokens: warn the maintainer, write the final handoff and stop; a fresh session
    continues from it. Beyond its own rules, the maintainer decides.
contract_version: "1.0"
