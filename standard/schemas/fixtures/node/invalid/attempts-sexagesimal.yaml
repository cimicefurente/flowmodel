# YAML 1.2 core: 1:30 is a string, not 90 (PA-5).
# expect: /errors_and_limits/attempts
kind: node
id: orders-service
name: Order service
type: component
origin: internal
purpose: Records an order and starts the payment.
input:
  - from: public-api
    artifact: create-order
    trigger: Synchronous call
    preconditions: The user is authenticated.
output:
  - to: payment-service
    artifact: order-created
    postconditions: The order is saved.
owner: Product team
card_status:
  status: decided
  decision: ADR-0004
determinism: true
verification:
  method: Contract tests; error monitoring.
errors_and_limits:
  error_outputs:
    - to: public-api
      artifact: invalid-order
  attempts: 1:30
contract_version: "2.1"
