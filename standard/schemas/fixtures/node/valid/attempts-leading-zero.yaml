# YAML 1.2 core: 08 is the integer 8; 017 is 17, not octal 15 (PA-5).
kind: node
id: orders-service
name: Order service
type: component
origin: internal
purpose: Records an order and starts the payment.
input:
  - from: public-api
    artifact: create-order
    trigger: Synchronous call
    preconditions: The user is authenticated.
output:
  - to: payment-service
    artifact: order-created
    postconditions: The order is saved.
owner: Product team
card_status:
  status: decided
  decision: ADR-0004
determinism: true
verification:
  method: Contract tests; error monitoring.
errors_and_limits:
  error_outputs:
    - to: public-api
      artifact: invalid-order
  budget:
    attempts: 017
  attempts: 08
contract_version: "2.1"
