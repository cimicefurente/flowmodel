name: Standard structure

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check sub-module files, cited IDs and prompt loads
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install the pinned dependencies
        run: python -m pip install -r scripts/requirements-schemas.txt
      - name: Check
        run: python scripts/check_standard.py
