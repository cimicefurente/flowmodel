name: Card schemas

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate schemas and fixtures
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the pinned validator
        run: python -m pip install -r scripts/requirements-schemas.txt
      - name: Validate
        run: python scripts/validate_schemas.py standard/schemas
